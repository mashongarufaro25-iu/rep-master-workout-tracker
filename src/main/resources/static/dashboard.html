<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
    <title>RepMaster</title>
    <!-- Link to our stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>


<!-- Main Registration Card  -->

<div class="container">

    <!--  Header  -->
    <header>

    </header>

    <!--  Create Workout Form -->
    <main>

        <form id="createWorkoutForm">

            <!-- workoutName -->
            <label for="workoutName">Workout Name</label>

            <input
                    type="text"
                    id="workoutName"
                    placeholder="Name of Workout"
                    required>

            <!-- Target Muscle -->
            <label for="targetMuscle">Target Muscle</label>

            <input
                    type="text"
                    id="targetMuscle"
                    placeholder="What is your target muscle"
                    required>

            <!-- exercises -->
            <label for="exercises"> Exercises</label>

            <input
                    type="text"
                    id="exercises"
                    placeholder="Enter you exercises"
                    required>


            <!-- Sets -->
            <label for="sets">Sets</label>

            <input
                    type="number"
                    id="sets"
                    placeholder="Number of sets for all workouts"
                    required>


            <!-- Reps -->
            <label for="reps">Reps</label>

            <input
                    type="number"
                    id="reps"
                    placeholder="Number of reps for all workouts"
                    required>



            <!-- Save Button -->
            <button type="submit" id="saveButton">

                Create Workout

            </button>

        </form>

    </main>


</div>

<!-- JavaScript -->
<script src="js/app.js"></script>

</body>
</html>
